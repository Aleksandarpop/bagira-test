<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. &amp; Mrs. PET Hotel — SEO Content Audit Report</title>
<style>
:root {
  --accent: #e67e22;
  --accent-dark: #d35400;
  --sidebar-bg: #1a1a2e;
  --sidebar-hover: #16213e;
  --content-bg: #f5f6fa;
  --card-bg: #ffffff;
  --text-primary: #2c3e50;
  --text-secondary: #6c757d;
  --border: #e0e0e0;
  --success: #27ae60;
  --warning: #f39c12;
  --danger: #e74c3c;
  --yellow: #f1c40f;
  --sidebar-w: 270px;
  --header-h: 64px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--content-bg); color: var(--text-primary); line-height: 1.6; }

/* Sidebar */
.sidebar {
  position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh;
  background: var(--sidebar-bg); color: #fff; z-index: 1000;
  display: flex; flex-direction: column; transition: transform .3s ease;
  overflow-y: auto;
}
.sidebar-brand { padding: 24px 20px 18px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.08); }
.sidebar-brand h2 { font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; color: var(--accent); }
.sidebar-brand small { color: rgba(255,255,255,.45); font-size: .72rem; display: block; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }
.sidebar-nav { flex: 1; padding: 8px 0; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 10px; padding: 11px 20px; color: rgba(255,255,255,.6);
  text-decoration: none; font-size: .82rem; transition: all .2s;
  border-left: 3px solid transparent;
}
.sidebar-nav a:hover, .sidebar-nav a.active {
  background: var(--sidebar-hover); color: #fff; border-left-color: var(--accent);
}
.sidebar-nav .nav-icon { font-size: .9rem; width: 20px; text-align: center; flex-shrink: 0; }
.sidebar-nav .nav-score {
  margin-left: auto; font-size: .7rem; font-weight: 700; padding: 2px 7px;
  border-radius: 10px; background: rgba(255,255,255,.1);
}

/* Hamburger */
.hamburger {
  display: none; position: fixed; top: 14px; left: 14px; z-index: 1100;
  background: var(--sidebar-bg); border: none; color: #fff; width: 40px; height: 40px;
  border-radius: 8px; cursor: pointer; font-size: 1.4rem; align-items: center; justify-content: center;
}
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 999; }

/* Header */
.main-header {
  position: fixed; top: 0; left: var(--sidebar-w); right: 0; height: var(--header-h);
  background: #fff; border-bottom: 1px solid var(--border); z-index: 900;
  display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
}
.main-header h1 { font-size: 1.1rem; color: var(--text-primary); }
.main-header h1 span { color: var(--text-secondary); font-weight: 400; font-size: .9rem; margin-left: 8px; }
.lang-toggle {
  display: flex; align-items: center; gap: 0;
  background: var(--content-bg); border-radius: 20px; overflow: hidden; border: 1px solid var(--border);
}
.lang-btn {
  padding: 6px 18px; border: none; background: transparent; cursor: pointer;
  font-weight: 700; font-size: .82rem; color: var(--text-secondary); transition: all .2s;
}
.lang-btn.active { background: var(--accent); color: #fff; }

/* Content */
.content { margin-left: var(--sidebar-w); margin-top: var(--header-h); padding: 30px; max-width: 1100px; }

/* Section cards */
.section { background: var(--card-bg); border-radius: 12px; margin-bottom: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.05); overflow: hidden; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px; cursor: pointer; user-select: none;
  transition: background .2s;
}
.section-header:hover { background: #fafbfc; }
.section-header h2 { font-size: 1.05rem; display: flex; align-items: center; gap: 12px; }
.section-header h2 .sec-icon { font-size: 1.1rem; }
.section-header .sec-score {
  font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 12px; margin-left: 10px;
}
.sec-score.red { background: #fde8e8; color: var(--danger); }
.sec-score.orange { background: #fef3e2; color: #e67e22; }
.sec-score.yellow { background: #fef9e7; color: #b7950b; }
.sec-score.green { background: #e8f8ef; color: var(--success); }
.section-toggle {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center; transition: transform .3s;
  font-size: .7rem; color: var(--text-secondary); flex-shrink: 0;
}
.section.collapsed .section-toggle { transform: rotate(-90deg); }
.section-body { padding: 24px; border-top: 1px solid var(--content-bg); }
.section.collapsed .section-body { display: none; }

/* Overall Score Hero */
.hero-score {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  border-radius: 12px; padding: 40px; color: #fff; margin-bottom: 24px;
  display: flex; align-items: center; gap: 40px; flex-wrap: wrap;
}
.score-ring { position: relative; width: 180px; height: 180px; flex-shrink: 0; }
.score-ring svg { width: 180px; height: 180px; transform: rotate(-90deg); }
.score-ring circle { fill: none; stroke-width: 10; }
.score-ring .ring-bg { stroke: rgba(255,255,255,.1); }
.score-ring .ring-fg { stroke: var(--danger); stroke-dasharray: 502; stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.score-ring .ring-text {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.score-ring .ring-val { font-size: 3rem; font-weight: 800; line-height: 1; }
.score-ring .ring-sub { font-size: .85rem; opacity: .7; margin-top: 4px; }
.hero-info { flex: 1; min-width: 250px; }
.hero-info .grade-badge {
  display: inline-block; background: var(--danger); color: #fff;
  font-size: 2rem; font-weight: 800; width: 52px; height: 52px;
  border-radius: 12px; text-align: center; line-height: 52px; margin-bottom: 12px;
}
.hero-info h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; opacity: .95; }
.hero-info p { font-size: .9rem; opacity: .7; line-height: 1.7; }
.hero-stats { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; }
.hero-stat { text-align: center; }
.hero-stat .hs-val { font-size: 1.5rem; font-weight: 800; }
.hero-stat .hs-label { font-size: .72rem; opacity: .6; text-transform: uppercase; letter-spacing: .5px; }

/* Score bars */
.score-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--content-bg); }
.score-row:last-child { border-bottom: none; }
.score-row .sr-label { width: 200px; font-weight: 600; font-size: .88rem; flex-shrink: 0; }
.score-row .sr-bar-wrap { flex: 1; height: 8px; background: var(--content-bg); border-radius: 4px; overflow: hidden; min-width: 80px; }
.score-row .sr-bar { height: 100%; border-radius: 4px; transition: width .8s ease; }
.score-row .sr-val { width: 55px; text-align: right; font-weight: 700; font-size: .88rem; flex-shrink: 0; }
.bar-red { background: var(--danger); }
.bar-orange { background: var(--warning); }
.bar-yellow { background: var(--yellow); }
.bar-green { background: var(--success); }
.text-red { color: var(--danger); }
.text-orange { color: var(--warning); }
.text-yellow { color: #b7950b; }
.text-green { color: var(--success); }

/* Subsection */
.subsection { margin-top: 20px; }
.subsection h3 { font-size: .95rem; font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--content-bg); }
.subsection h4 { font-size: .88rem; font-weight: 700; margin: 16px 0 8px; color: var(--text-primary); }

/* Cards grid */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.rec-card {
  border: 1px solid var(--border); border-radius: 10px; padding: 18px;
  transition: box-shadow .2s; position: relative; overflow: hidden;
}
.rec-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.rec-card .rc-num {
  position: absolute; top: 0; right: 0; background: var(--accent); color: #fff;
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  border-radius: 0 10px 0 10px; font-weight: 700; font-size: .8rem;
}
.rec-card h4 { font-size: .9rem; margin-bottom: 6px; padding-right: 34px; }
.rec-card p { font-size: .82rem; color: var(--text-secondary); margin-bottom: 8px; }
.rec-card .rc-impact {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: .76rem; font-weight: 700;
}
.rc-impact.green { background: #e8f8ef; color: var(--success); }
.rc-impact.orange { background: #fef3e2; color: #e67e22; }
.rc-impact.blue { background: #ebf5fb; color: #2980b9; }
.rc-impact.red { background: #fde8e8; color: var(--danger); }

/* Tables */
.resp-table { width: 100%; overflow-x: auto; }
.resp-table table { width: 100%; border-collapse: collapse; font-size: .85rem; min-width: 500px; }
.resp-table th {
  background: var(--sidebar-bg); color: #fff; padding: 11px 14px; text-align: left;
  font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .5px;
}
.resp-table td { padding: 10px 14px; border-bottom: 1px solid var(--content-bg); }
.resp-table tr:hover td { background: #fafbfc; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .72rem; font-weight: 700; }
.badge-red { background: #fde8e8; color: var(--danger); }
.badge-orange { background: #fef3e2; color: #e67e22; }
.badge-green { background: #e8f8ef; color: var(--success); }
.badge-blue { background: #ebf5fb; color: #2980b9; }
.badge-yellow { background: #fef9e7; color: #b7950b; }

/* Stat cards */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.stat-card {
  background: var(--content-bg); border-radius: 10px; padding: 16px; text-align: center;
}
.stat-card .sv { font-size: 1.4rem; font-weight: 800; }
.stat-card .sl { font-size: .76rem; color: var(--text-secondary); margin-top: 4px; }

/* Key finding callout */
.callout {
  background: #fef9e7; border-left: 4px solid var(--warning); padding: 14px 18px;
  border-radius: 0 8px 8px 0; margin: 14px 0; font-size: .88rem;
}
.callout.danger { background: #fde8e8; border-left-color: var(--danger); }
.callout.success { background: #e8f8ef; border-left-color: var(--success); }
.callout strong { color: var(--text-primary); }

/* Check list */
.check-list { list-style: none; }
.check-list li { padding: 6px 0; font-size: .88rem; display: flex; align-items: flex-start; gap: 8px; }
.check-list .icon-pass { color: var(--success); font-weight: 700; }
.check-list .icon-fail { color: var(--danger); font-weight: 700; }
.check-list .icon-warn { color: var(--warning); font-weight: 700; }

/* Exec text */
.exec-text { font-size: .92rem; line-height: 1.8; color: var(--text-secondary); }
.exec-text strong { color: var(--text-primary); }

/* Code block */
.code-block { background: #1a1a2e; color: #e8e8e8; border-radius: 8px; padding: 16px; font-family: 'Consolas', 'Monaco', monospace; font-size: .78rem; overflow-x: auto; line-height: 1.6; margin: 12px 0; white-space: pre; }

/* Footer */
.footer {
  text-align: center; padding: 24px; color: var(--text-secondary); font-size: .8rem;
  border-top: 1px solid var(--border); margin-top: 10px;
}

/* Print */
@media print {
  .sidebar, .hamburger, .overlay, .main-header, .lang-toggle, .section-toggle { display: none !important; }
  .content { margin: 0 !important; padding: 10px !important; max-width: none; }
  .section { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
  .section.collapsed .section-body { display: block !important; }
  .hero-score { color: #000 !important; background: #f5f5f5 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* Responsive */
@media (max-width: 1024px) { :root { --sidebar-w: 240px; } }
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); width: 280px; }
  .sidebar.open { transform: translateX(0); }
  .overlay.open { display: block; }
  .hamburger { display: flex; }
  .main-header { left: 0; padding: 0 14px 0 62px; }
  .main-header h1 { font-size: .9rem; }
  .main-header h1 span { display: none; }
  .content { margin-left: 0; padding: 20px 14px; }
  .hero-score { flex-direction: column; align-items: center; text-align: center; padding: 30px 20px; }
  .score-row { flex-wrap: wrap; }
  .score-row .sr-label { width: 100%; font-size: .82rem; }
  .card-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}

/* Scrollbar */
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }
</style>
</head>
<body>

<button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">&#9776;</button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <h2>Mr. &amp; Mrs. PET</h2>
    <small id="sbSub">SEO Content Audit</small>
  </div>
  <div class="sidebar-nav" id="sidebarNav"></div>
</nav>

<header class="main-header">
  <h1 id="headerTitle">SEO Content Audit Report <span>mrmrspet.bg</span></h1>
  <div class="lang-toggle">
    <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btnBG" onclick="setLang('bg')">BG</button>
  </div>
</header>

<main class="content" id="mc"></main>

<script>
let lang = 'en';
const L = (en, bg) => lang === 'bg' ? bg : en;

function scoreColor(s) {
  if (s < 40) return 'red';
  if (s <= 60) return 'orange';
  if (s <= 75) return 'yellow';
  return 'green';
}
function barCls(s) { return 'bar-' + scoreColor(s); }
function txtCls(s) { return 'text-' + scoreColor(s); }

const NAV = [
  { id: 'overview', icon: '&#9733;', en: 'Overview & Score', bg: 'Преглед и Оценка', score: '34/100' },
  { id: 'bugs', icon: '&#128027;', en: 'Bugs & Issues', bg: 'Бъгове и Проблеми', score: '4' },
  { id: 'titles', icon: '&#127991;', en: 'Title Tags & Meta', bg: 'Title тагове и Мета', score: '15/100' },
  { id: 'headings', icon: '&#128196;', en: 'Heading & Content', bg: 'Заглавия и Съдържание', score: '25/100' },
  { id: 'keywords', icon: '&#128269;', en: 'Keyword Targeting', bg: 'Ключови Думи', score: '20/100' },
  { id: 'eeat', icon: '&#128101;', en: 'E-E-A-T Assessment', bg: 'E-E-A-T Оценка', score: '38/100' },
  { id: 'techseo', icon: '&#9881;', en: 'Technical SEO', bg: 'Техническо SEO', score: '30/100' },
  { id: 'local', icon: '&#128205;', en: 'Local SEO', bg: 'Локално SEO', score: '15/100' },
  { id: 'gaps', icon: '&#128200;', en: 'Content Gap Analysis', bg: 'Анализ на Липси', score: '' },
  { id: 'schema', icon: '&#128295;', en: 'Schema & Structured Data', bg: 'Schema и Данни', score: '25/100' },
  { id: 'blog', icon: '&#9997;', en: 'Blog & Content Strategy', bg: 'Блог и Стратегия', score: '25/100' },
  { id: 'social', icon: '&#128242;', en: 'Social Media', bg: 'Социални Медии', score: '45/100' },
  { id: 'action', icon: '&#128221;', en: 'Action Plan', bg: 'План за Действие', score: '' },
];

function buildNav() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = NAV.map(n => {
    const lbl = L(n.en, n.bg);
    const sc = n.score ? `<span class="nav-score">${n.score}</span>` : '';
    return `<a href="#${n.id}" onclick="closeSidebar()"><span class="nav-icon">${n.icon}</span>${lbl}${sc}</a>`;
  }).join('');
}

function render() {
  document.getElementById('headerTitle').innerHTML = L(
    'SEO Content Audit Report <span>mrmrspet.bg</span>',
    'SEO Одит на Съдържанието <span>mrmrspet.bg</span>'
  );
  document.getElementById('sbSub').textContent = L('SEO Content Audit', 'SEO Одит на Съдържанието');
  buildNav();

  const mc = document.getElementById('mc');
  let h = '';

  // ============ HERO SCORE ============
  const dashOff = 502 - (502 * 34 / 100);
  h += `
  <div class="hero-score" id="overview">
    <div class="score-ring">
      <svg viewBox="0 0 180 180"><circle class="ring-bg" cx="90" cy="90" r="80"/><circle class="ring-fg" cx="90" cy="90" r="80" style="stroke-dashoffset:${dashOff}"/></svg>
      <div class="ring-text"><div class="ring-val">34</div><div class="ring-sub">${L('out of 100','от 100')}</div></div>
    </div>
    <div class="hero-info">
      <div class="grade-badge">F</div>
      <h3>${L('Mr. & Mrs. PET Hotel \u2014 SEO Content Audit','Mr. & Mrs. PET Hotel \u2014 SEO Одит на Съдържанието')}</h3>
      <p>${L(
        "Mr. & Mrs. PET Hotel's website is underperforming in SEO. Primary keywords ('хотел за кучета София', 'хотел за котки София') appear in zero title tags, the H1 is brand-only, meta descriptions are duplicated or auto-generated, there is no LocalBusiness schema, no Google Business Profile, and 0 Google reviews \u2014 while competitors have 130\u2013408. The business has 6 Facebook reviews (100% recommendation) and active social media presence. The blog has 5 posts (last updated July 2025) with thin, unlinked content. The site has a functional booking system and professional photography, but is virtually invisible in local search results.",
        "Уебсайтът на хотел Mr. & Mrs. PET изостава в SEO. Основните ключови думи ('хотел за кучета София', 'хотел за котки София') не присъстват в нито един title таг, H1 е само бранд, мета описанията са дублирани или автоматично генерирани, липсва LocalBusiness schema, няма Google Business профил и 0 Google ревюта \u2014 докато конкурентите имат 130\u2013408. Бизнесът има 6 Facebook ревюта (100% препоръка) и активно присъствие в социалните медии. Блогът има 5 публикации (последно обновен юли 2025) с кратко, несвързано съдържание. Сайтът има функционална система за резервации и професионална фотография, но е практически невидим в локалните резултати от търсенето."
      )}</p>
      <div class="hero-stats">
        <div class="hero-stat"><div class="hs-val" style="color:#e74c3c">0</div><div class="hs-label">${L('Keywords in Titles','Ключови думи в заглавия')}</div></div>
        <div class="hero-stat"><div class="hs-val" style="color:#e74c3c">0</div><div class="hs-label">${L('Google Reviews','Google ревюта')}</div></div>
        <div class="hero-stat"><div class="hs-val" style="color:#f39c12">5</div><div class="hs-label">${L('Blog Posts (8mo stale)','Блог поста (8мес неактивни)')}</div></div>
        <div class="hero-stat"><div class="hs-val" style="color:#e74c3c">59</div><div class="hs-label">${L('JS Files','JS файла')}</div></div>
      </div>
    </div>
  </div>`;

  // ============ SCORE BREAKDOWN ============
  h += sec('overview-detail', '&#9733;', L('Score Breakdown','Разбивка на Оценките'), '34/100', false, `
    <div class="subsection"><h3>${L('Category Scores','Оценки по Категории')}</h3>
    ${scoreBar(L('Title Tags','Title тагове'), 20, 10, L('Duplicate/missing keywords across all pages','Дублирани/липсващи ключови думи на всички страници'))}
    ${scoreBar(L('Meta Descriptions','Мета описания'), 20, 10, L('Too short, duplicated, or auto-generated','Твърде кратки, дублирани или автоматично генерирани'))}
    ${scoreBar(L('Heading Structure','Структура на заглавия'), 30, 10, L('48 headings, many duplicates, H6 misuse','48 заглавия, много дублирани, неправилна употреба на H6'))}
    ${scoreBar(L('Image Optimization','Оптимизация на изображения'), 40, 10, L('35% missing alt text, 0% lazy loading','35% липсващ alt текст, 0% lazy loading'))}
    ${scoreBar(L('E-E-A-T Quality','E-E-A-T качество'), 40, 10, L('Thin blog posts, no author bios, weak authority. 6 Facebook reviews (100% recommendation) provide some trust signal.','Кратки блог постове, без автор биографии, слаб авторитет. 6 Facebook ревюта (100% препоръка) осигуряват известен сигнал за доверие.'))}
    ${scoreBar(L('Schema / Structured Data','Schema / Структурирани данни'), 30, 10, L('Missing LocalBusiness, incomplete Organization','Липсва LocalBusiness, непълен Organization'))}
    ${scoreBar(L('Internal Linking','Вътрешно линкване'), 20, 10, L('Blog posts have zero internal links in body','Блог постовете нямат вътрешни линкове в текста'))}
    ${scoreBar(L('Technical SEO','Техническо SEO'), 40, 10, L('59 JS files, demo domain CTAs, minor footer email href discrepancy','59 JS файла, CTA към demo домейна, малко несъответствие в href на footer имейла'))}

// Helper: section
function sec(id, icon, title, score, collapsed, body) {
  const scoreBadge = score ? `<span class="sec-score ${scoreColor(parseInt(score) || 0)}">${score}</span>` : '';
  const cls = collapsed ? ' collapsed' : '';
  return `
  <div class="section${cls}" id="${id}">
    <div class="section-header" onclick="toggle(this)">
      <h2><span class="sec-icon">${icon}</span> ${title} ${scoreBadge}</h2>
      <div class="section-toggle">&#9660;</div>
    </div>
    <div class="section-body">${body}</div>
  </div>`;
}

// Helper: score bar
function scoreBar(label, score, weight, finding) {
  const w = weight ? `<span style="font-size:.72rem;color:var(--text-secondary);margin-left:6px">(${weight}%)</span>` : '';
  return `
  <div class="score-row">
    <div class="sr-label">${label}${w}</div>
    <div class="sr-bar-wrap"><div class="sr-bar ${barCls(score)}" style="width:${score}%"></div></div>
    <div class="sr-val ${txtCls(score)}">${score}/100</div>
  </div>
  ${finding ? `<div style="padding:0 0 6px;font-size:.8rem;color:var(--text-secondary);border-bottom:1px solid var(--content-bg);margin-bottom:2px">${finding}</div>` : ''}`;
}

// Helper: quick win card
function qw(num, title, desc, impact, impactCls) {
  const impactHtml = impact ? `<div class="rc-impact ${impactCls}">${impact}</div>` : '';
  return `
  <div class="rec-card">
    <div class="rc-num">${num}</div>
    <h4>${title}</h4>
    <p>${desc}</p>
    ${impactHtml}
  </div>`;
}

function toggle(header) {
  header.parentElement.classList.toggle('collapsed');
}

function setLang(l) {
  lang = l;
  document.getElementById('btnEN').classList.toggle('active', l === 'en');
  document.getElementById('btnBG').classList.toggle('active', l === 'bg');
  document.documentElement.lang = l === 'bg' ? 'bg' : 'en';
  render();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// Active nav on scroll
window.addEventListener('scroll', () => {
  const links = document.querySelectorAll('.sidebar-nav a');
  let current = '';
  NAV.forEach(n => {
    const el = document.getElementById(n.id);
    if (el && el.getBoundingClientRect().top < 150) current = n.id;
  });
  links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + current));
});

render();
</script>
