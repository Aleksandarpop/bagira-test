<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAGIRA Marketing Audit Report</title>
<style>
:root {
  --accent: #e31e24;
  --accent-dark: #b8181d;
  --sidebar-bg: #1a1a2e;
  --sidebar-hover: #16213e;
  --content-bg: #f5f6fa;
  --card-bg: #ffffff;
  --text-primary: #2c3e50;
  --text-secondary: #6c757d;
  --border: #e0e0e0;
  --success: #27ae60;
  --warning: #f39c12;
  --danger: #e74c3c;
  --sidebar-w: 260px;
  --header-h: 64px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--content-bg); color: var(--text-primary); line-height: 1.6; }

/* Sidebar */
.sidebar {
  position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh;
  background: var(--sidebar-bg); color: #fff; z-index: 1000;
  display: flex; flex-direction: column; transition: transform .3s ease;
  overflow-y: auto;
}
.sidebar-brand { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.1); }
.sidebar-brand h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: 2px; color: var(--accent); }
.sidebar-brand small { color: rgba(255,255,255,.5); font-size: .75rem; }
.sidebar-nav { flex: 1; padding: 10px 0; }
.sidebar-nav a {
  display: block; padding: 10px 20px; color: rgba(255,255,255,.7);
  text-decoration: none; font-size: .85rem; transition: all .2s;
  border-left: 3px solid transparent;
}
.sidebar-nav a:hover, .sidebar-nav a.active {
  background: var(--sidebar-hover); color: #fff; border-left-color: var(--accent);
}
.sidebar-nav a .nav-num { color: var(--accent); font-weight: 700; margin-right: 8px; font-size: .75rem; }

/* Hamburger */
.hamburger {
  display: none; position: fixed; top: 14px; left: 14px; z-index: 1100;
  background: var(--sidebar-bg); border: none; color: #fff; width: 38px; height: 38px;
  border-radius: 6px; cursor: pointer; font-size: 1.3rem; align-items: center; justify-content: center;
}
.overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 999;
}

/* Header */
.main-header {
  position: fixed; top: 0; left: var(--sidebar-w); right: 0; height: var(--header-h);
  background: #fff; border-bottom: 1px solid var(--border); z-index: 900;
  display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
}
.main-header h1 { font-size: 1.15rem; color: var(--text-primary); }
.lang-toggle {
  display: flex; align-items: center; gap: 0;
  background: var(--content-bg); border-radius: 20px; overflow: hidden; border: 1px solid var(--border);
}
.lang-btn {
  padding: 6px 16px; border: none; background: transparent; cursor: pointer;
  font-weight: 600; font-size: .85rem; color: var(--text-secondary); transition: all .2s;
}
.lang-btn.active { background: var(--accent); color: #fff; }

/* Content */
.content { margin-left: var(--sidebar-w); margin-top: var(--header-h); padding: 30px; max-width: 1200px; }

/* Sections */
.section { background: var(--card-bg); border-radius: 12px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border);
  transition: background .2s;
}
.section-header:hover { background: var(--content-bg); }
.section-header h2 { font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
.section-header h2 .sec-num {
  background: var(--accent); color: #fff; width: 28px; height: 28px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; flex-shrink: 0;
}
.section-toggle {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center; transition: transform .3s;
  font-size: .8rem; color: var(--text-secondary); flex-shrink: 0;
}
.section.collapsed .section-toggle { transform: rotate(-90deg); }
.section-body { padding: 24px; transition: max-height .4s ease, opacity .3s ease; overflow: hidden; }
.section.collapsed .section-body { max-height: 0 !important; padding: 0 24px; opacity: 0; }

/* Overall Score */
.overall-score-wrap { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; padding: 20px 0; }
.score-circle {
  width: 160px; height: 160px; border-radius: 50%; position: relative;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.score-circle .score-val { font-size: 2.5rem; font-weight: 800; color: var(--text-primary); }
.score-circle .score-label { font-size: .85rem; color: var(--text-secondary); }
.score-circle-inner { text-align: center; }
.score-meta { flex: 1; min-width: 200px; }
.score-meta .grade { font-size: 3rem; font-weight: 800; color: var(--danger); }
.score-meta p { color: var(--text-secondary); margin-top: 4px; }

/* Score gauge rows */
.score-row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--content-bg); }
.score-row:last-child { border-bottom: none; }
.score-row .sr-label { width: 220px; font-weight: 600; font-size: .9rem; flex-shrink: 0; }
.score-row .sr-bar-wrap { flex: 1; height: 10px; background: var(--content-bg); border-radius: 5px; overflow: hidden; min-width: 100px; }
.score-row .sr-bar { height: 100%; border-radius: 5px; transition: width .6s ease; }
.score-row .sr-val { width: 60px; text-align: right; font-weight: 700; font-size: .9rem; flex-shrink: 0; }
.score-row .sr-finding { color: var(--text-secondary); font-size: .83rem; margin-top: 2px; }

/* Color helpers */
.bar-red { background: var(--danger); }
.bar-orange { background: var(--warning); }
.bar-green { background: var(--success); }
.text-red { color: var(--danger); }
.text-orange { color: var(--warning); }
.text-green { color: var(--success); }

/* Recommendation cards */
.rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.rec-card {
  border: 1px solid var(--border); border-radius: 10px; padding: 18px;
  transition: box-shadow .2s; position: relative; overflow: hidden;
}
.rec-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.rec-card .rec-num {
  position: absolute; top: 0; right: 0; background: var(--accent); color: #fff;
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  border-radius: 0 10px 0 10px; font-weight: 700; font-size: .85rem;
}
.rec-card h4 { font-size: .95rem; margin-bottom: 6px; padding-right: 36px; }
.rec-card .rec-impact {
  display: inline-block; background: #e8f5e9; color: var(--success); padding: 2px 10px;
  border-radius: 12px; font-size: .8rem; font-weight: 600; margin-top: 6px;
}

/* Tables */
.resp-table { width: 100%; overflow-x: auto; }
.resp-table table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 500px; }
.resp-table th {
  background: var(--sidebar-bg); color: #fff; padding: 12px 14px; text-align: left;
  font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .5px;
}
.resp-table td { padding: 11px 14px; border-bottom: 1px solid var(--content-bg); }
.resp-table tr:hover td { background: #fafbfc; }

/* Mini gauge (inline) */
.mini-gauge {
  display: inline-flex; align-items: center; gap: 8px;
}
.mini-gauge .mg-bar { width: 60px; height: 6px; background: var(--content-bg); border-radius: 3px; overflow: hidden; }
.mini-gauge .mg-fill { height: 100%; border-radius: 3px; }

/* SEO / Funnel grid */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.stat-card {
  background: var(--content-bg); border-radius: 10px; padding: 16px; text-align: center;
}
.stat-card .stat-val { font-size: 1.5rem; font-weight: 800; }
.stat-card .stat-label { font-size: .8rem; color: var(--text-secondary); margin-top: 4px; }
.stat-card.good .stat-val { color: var(--success); }
.stat-card.warn .stat-val { color: var(--warning); }
.stat-card.bad .stat-val { color: var(--danger); }

/* Funnel visual */
.funnel-visual { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 20px 0; }
.funnel-step {
  padding: 12px 20px; text-align: center; color: #fff; font-weight: 600; font-size: .85rem;
  position: relative; border-radius: 4px; margin-bottom: 4px;
}
.funnel-step small { display: block; font-weight: 400; opacity: .85; font-size: .75rem; }

/* Reports list */
.reports-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.report-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  background: var(--content-bg); border-radius: 10px; font-weight: 500; font-size: .9rem;
}
.report-item .ri-icon {
  width: 36px; height: 36px; border-radius: 8px; background: var(--accent);
  color: #fff; display: flex; align-items: center; justify-content: center; font-size: .9rem; flex-shrink: 0;
}

/* Revenue summary */
.rev-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 10px; }
.rev-card {
  background: linear-gradient(135deg, var(--sidebar-bg), #16213e); color: #fff;
  border-radius: 12px; padding: 24px; text-align: center;
}
.rev-card .rev-val { font-size: 1.6rem; font-weight: 800; margin: 8px 0; }
.rev-card .rev-label { font-size: .82rem; opacity: .8; }

/* Footer */
.footer {
  text-align: center; padding: 20px; color: var(--text-secondary); font-size: .82rem;
  border-top: 1px solid var(--border); margin-top: 10px;
}

/* Executive summary */
.exec-text { font-size: .95rem; line-height: 1.8; color: var(--text-secondary); }
.exec-text strong { color: var(--text-primary); }

/* Print */
@media print {
  .sidebar, .hamburger, .overlay, .main-header, .lang-toggle, .section-toggle { display: none !important; }
  .content { margin: 0 !important; padding: 10px !important; }
  .section { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
  .section.collapsed .section-body { max-height: none !important; padding: 24px !important; opacity: 1 !important; }
}

/* Responsive */
@media (max-width: 1024px) {
  :root { --sidebar-w: 220px; }
}
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); width: 280px; }
  .sidebar.open { transform: translateX(0); }
  .overlay.open { display: block; }
  .hamburger { display: flex; }
  .main-header { left: 0; padding: 0 14px 0 60px; }
  .main-header h1 { font-size: .95rem; }
  .content { margin-left: 0; padding: 20px 14px; }
  .overall-score-wrap { flex-direction: column; align-items: flex-start; gap: 20px; }
  .score-row { flex-wrap: wrap; }
  .score-row .sr-label { width: 100%; }
  .rec-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .rev-cards { grid-template-columns: 1fr; }
}

/* Scrollbar */
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 2px; }
</style>
</head>

      <h2><span class="sec-num">3</span>${t(T.sections[2].title)}</h2>
      <div class="section-toggle">\u25BC</div>
    </div>
    <div class="section-body">${scoreRows}</div>
  </div>`;

  // 4. Quick Wins
  let qwCards = T.quickWins.map((q,i) => `
    <div class="rec-card">
      <div class="rec-num">${i+1}</div>
      <h4>${t(q.title)}</h4>
      <div class="rec-impact">${typeof q.impact === 'object' ? t(q.impact) : q.impact}</div>
    </div>
  `).join('');
  mc.innerHTML += `
  <div class="section" id="quickwins">
    <div class="section-header" onclick="toggleSection(this)">
      <h2><span class="sec-num">4</span>${t(T.sections[3].title)}</h2>
      <div class="section-toggle">\u25BC</div>
    </div>
    <div class="section-body"><div class="rec-grid">${qwCards}</div></div>
  </div>`;

  // 5. Strategic
  let stCards = T.strategic.map((s,i) => `
    <div class="rec-card">
      <div class="rec-num">${i+1}</div>
      <h4>${t(s.title)}</h4>
      <div class="rec-impact">${t(s.impact)}</div>
    </div>
  `).join('');
  mc.innerHTML += `
  <div class="section" id="strategic">
    <div class="section-header" onclick="toggleSection(this)">
      <h2><span class="sec-num">5</span>${t(T.sections[4].title)}</h2>
      <div class="section-toggle">\u25BC</div>
    </div>
    <div class="section-body"><div class="rec-grid">${stCards}</div></div>
  </div>`;

  // 6. Long-Term
  let ltCards = T.longterm.map((l,i) => `
    <div class="rec-card">
      <div class="rec-num">${i+1}</div>
      <h4>${t(l.title)}</h4>
      <div class="rec-impact">${t(l.impact)}</div>
    </div>
  `).join('');
  mc.innerHTML += `
  <div class="section" id="longterm">
    <div class="section-header" onclick="toggleSection(this)">
      <h2><span class="sec-num">6</span>${t(T.sections[5].title)}</h2>
      <div class="section-toggle">\u25BC</div>
    </div>
    <div class="section-body"><div class="rec-grid">${ltCards}</div></div>
  </div>`;

  // 7. Competitors
  let compRows = T.competitors.map(c => `
    <tr>
      <td><strong>${c.name}</strong></td>
      <td>${c.products}</td>
      <td>${c.stores}</td>
      <td>${t(c.online)}</td>
      <td>${t(c.edge)}</td>
    </tr>
  `).join('');
  mc.innerHTML += `
  <div class="section" id="competitors">
    <div class="section-header" onclick="toggleSection(this)">
      <h2><span class="sec-num">7</span>${t(T.sections[6].title)}</h2>
      <div class="section-toggle">\u25BC</div>
    </div>
    <div class="section-body">
      <div class="resp-table"><table>
        <thead><tr>
          <th>${lang==='en'?'Competitor':'Конкурент'}</th>
          <th>${lang==='en'?'Products':'Продукти'}</th>
          <th>${lang==='en'?'Stores':'Магазини'}</th>
          <th>Online</th>
          <th>${lang==='en'?'Bagira\'s Edge':'Предимство на Багира'}</th>
        </tr></thead>
        <tbody>${compRows}</tbody>
      </table></div>
    </div>
  </div>`;

  // 8. Social
  let socialRows = T.social.map(s => `
    <tr>
      <td><strong>${s.platform}</strong></td>
      <td>${s.followers}</td>
      <td>${t(s.status)}</td>
    </tr>
  `).join('');
  mc.innerHTML += `
  <div class="section" id="social">
    <div class="section-header" onclick="toggleSection(this)">
      <h2><span class="sec-num">8</span>${t(T.sections[7].title)}</h2>
      <div class="section-toggle">\u25BC</div>
    </div>
    <div class="section-body">
      <div class="resp-table"><table>
        <thead><tr>
          <th>${lang==='en'?'Platform':'Платформа'}</th>
          <th>${lang==='en'?'Followers':'Последователи'}</th>
          <th>${lang==='en'?'Status':'Статус'}</th>
        </tr></thead>
        <tbody>${socialRows}</tbody>
      </table></div>
    </div>
  </div>`;

  // 9. Revenue
  mc.innerHTML += `
  <div class="section" id="revenue">
    <div class="section-header" onclick="toggleSection(this)">
      <h2><span class="sec-num">9</span>${t(T.sections[8].title)}</h2>
      <div class="section-toggle">\u25BC</div>
    </div>
    <div class="section-body">
      <div class="rev-cards">
        <div class="rev-card">
          <div class="rev-label">${lang==='en'?'Total Monthly Potential':'Общ Месечен Потенциал'}</div>
          <div class="rev-val">+31,500-58,000\u20ac</div>
        </div>
        <div class="rev-card">
          <div class="rev-label">${lang==='en'?'Conservative 6-Month':'Консервативен 6-Месечен'}</div>
          <div class="rev-val">+20,000\u20ac/${lang==='en'?'mo':'\u043c\u0435\u0441'}</div>
        </div>
        <div class="rev-card">
          <div class="rev-label">${lang==='en'?'Aggressive 6-Month':'Агресивен 6-Месечен'}</div>
          <div class="rev-val">+50,000\u20ac/${lang==='en'?'mo':'\u043c\u0435\u0441'}</div>
        </div>
      </div>
    </div>
  </div>`;

  // 10. SEO
  let seoCards = T.seo.map(s => {
    let val = t(s.value);
    let lbl = t(s.label);
    let note = s.note ? `<div style="font-size:.7rem;margin-top:2px;opacity:.7">${t(s.note)}</div>` : '';
    return `<div class="stat-card ${s.cls}"><div class="stat-val">${val}</div><div class="stat-label">${lbl}</div>${note}</div>`;
  }).join('');
  mc.innerHTML += `
  <div class="section" id="seo">
    <div class="section-header" onclick="toggleSection(this)">
      <h2><span class="sec-num">10</span>${t(T.sections[9].title)}</h2>
      <div class="section-toggle">\u25BC</div>
    </div>
    <div class="section-body"><div class="stat-grid">${seoCards}</div></div>
  </div>`;

  // 11. Funnel
  const funnelColors = ['#27ae60','#2ecc71','#f39c12','#e74c3c'];
  let funnelSteps = T.funnelSteps.map((f,i) => `
    <div class="funnel-step" style="background:${funnelColors[i]};width:${f.w}%;min-width:200px">
      ${t(f.label)}<small>~${f.pct}%</small>
    </div>
  `).join('');
  mc.innerHTML += `
  <div class="section" id="funnel">
    <div class="section-header" onclick="toggleSection(this)">
      <h2><span class="sec-num">11</span>${t(T.sections[10].title)}</h2>
      <div class="section-toggle">\u25BC</div>
    </div>
    <div class="section-body">
      <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px">
        <div class="stat-card bad" style="flex:1;min-width:140px"><div class="stat-val">38/100</div><div class="stat-label">${lang==='en'?'Funnel Score':'Оценка на Фунъла'}</div></div>
        <div class="stat-card bad" style="flex:1;min-width:140px"><div class="stat-val">1-1.5%</div><div class="stat-label">${lang==='en'?'Overall Conversion':'Обща Конверсия'}</div></div>
        <div class="stat-card warn" style="flex:1;min-width:140px"><div class="stat-val">2-4%</div><div class="stat-label">${lang==='en'?'Industry Benchmark':'Индустриален Бенчмарк'}</div></div>
      </div>
      <div class="funnel-visual">${funnelSteps}</div>
    </div>
  </div>`;

  // 12. Reports
  let reportItems = T.reports.map(r => `
    <div class="report-item">
      <div class="ri-icon">${r.icon}</div>
      <span>${t(r.name)}</span>
    </div>
  `).join('');
  mc.innerHTML += `
  <div class="section" id="reports">
    <div class="section-header" onclick="toggleSection(this)">
      <h2><span class="sec-num">12</span>${t(T.sections[11].title)}</h2>
      <div class="section-toggle">\u25BC</div>
    </div>
    <div class="section-body"><div class="reports-list">${reportItems}</div></div>
  </div>`;

  // Footer
  mc.innerHTML += `<div class="footer">Generated by AI Marketing Suite \u2014 2026-03-18</div>`;

  // Restore collapsed states
  Object.keys(collapsedState).forEach(id => {
    if (collapsedState[id]) {
      const el = document.getElementById(id);
      if (el) el.classList.add('collapsed');
    }
  });
}

const collapsedState = {};

function toggleSection(header) {
  const section = header.parentElement;
  section.classList.toggle('collapsed');
  collapsedState[section.id] = section.classList.contains('collapsed');
}

function setLang(l) {
  lang = l;
  document.getElementById('btnEN').classList.toggle('active', l === 'en');
  document.getElementById('btnBG').classList.toggle('active', l === 'bg');
  document.documentElement.lang = l === 'bg' ? 'bg' : 'en';
  renderAll();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// Active nav on scroll
window.addEventListener('scroll', () => {
  const links = document.querySelectorAll('.sidebar-nav a');
  const sections = T.sections.map(s => document.getElementById(s.id)).filter(Boolean);
  let current = '';
  sections.forEach(s => {
    if (s.getBoundingClientRect().top < 150) current = s.id;
  });
  links.forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '#' + current);
  });
});

renderAll();
</script>
</body>
</html>
